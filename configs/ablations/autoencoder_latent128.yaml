augmentation:
  brightness_jitter: 0.1
  enabled: true
  horizontal_flip: true
  rotation_degrees: 10
  vertical_flip: false
checkpointing:
  mode: min
  monitor_metric: val_reconstruction_error
  save_dir: models/ablations/autoencoder_latent128
data:
  category: bottle
  image_size: 128
  normal_val_fraction: 0.15
  num_workers: 2
  root: data/mvtec_ad
device:
  prefer_cuda: true
experiment:
  description: 'Ablation (README section 12, item 3): latent_dim = 128. All other
    hyperparameters identical to configs/autoencoder.yaml. Expected trade-off per
    src/models/autoencoder.py docstring: too small under-reconstructs normal texture
    (more false positives), too large starts reconstructing defects too (more false
    negatives).'
  name: ablation_autoencoder_latent128
  seed: 42
model:
  architecture: conv_autoencoder
  base_channels: 32
  latent_dim: 128
  num_downsample_blocks: 4
threshold_selection:
  fallback_percentile: 95
  method: f1_optimal_on_validation
training:
  batch_size: 16
  early_stopping_patience: 15
  epochs: 100
  learning_rate: 0.001
  loss: mse
  optimizer: adam
  scheduler: reduce_on_plateau
  scheduler_patience: 5
  weight_decay: 1.0e-05
